[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-access-main"
version = "1.0.0"
description = "Independent reproduction of the main label-access experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "numba>=0.61,<1"]

[project.scripts]
label-access = "latc.cli:main"

[tool.setuptools.packages.find]
include = ["latc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full 12-coordinate exhaustive enumeration or full experiment grid"]
